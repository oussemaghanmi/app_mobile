# Tient le tableau GitHub Projects à jour : ajoute chaque nouvelle issue en « Todo » et déplace les cartes
# pour les statuts que les workflows intégrés du tableau ne couvrent pas (eux gèrent « Done » à la fermeture
# et à la fusion). Reste INACTIF (job vert) tant que le secret PROJECT_TOKEN et la variable PROJECT_NUMBER
# ne sont pas définis : voir docs/BOARD.md.
name: board

on:
  issues:
    types: [assigned, unassigned, opened, closed, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [develop]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      number:
        description: Numéro de l'issue ou de la PR
        required: true
      status:
        description: Todo, In progress, Blocked, In review ou Done
        required: true

concurrency:
  group: board-${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  move:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
    steps:
      - name: Vérifier la configuration
        id: gate
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$PROJECT_NUMBER" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PROJECT_TOKEN (secret) ou PROJECT_NUMBER (variable) absent : tableau ignoré. Voir docs/BOARD.md."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          sparse-checkout: scripts
      - name: Déplacer les cartes
        if: steps.gate.outputs.enabled == 'true'
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ inputs.number }}
          STATUS: ${{ inputs.status }}
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          move() { scripts/board-status.sh "$1" "$2"; }
          # Une issue fermée reste « Done », quoi qu'il arrive à la PR ou à la décision qui la cite.
          move_if_open() {
            state=$(GH_TOKEN="$REPO_TOKEN" gh issue view "$1" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
            if [ "$state" = OPEN ]; then move "$1" "$2"; fi
          }
          has_label() { jq -e --arg l "$1" '.issue.labels | any(.name == $l)' "$GITHUB_EVENT_PATH" >/dev/null; }
          # Les issues qu'une PR ferme, d'après les lignes « Closes #n » de sa description.
          move_closed() {
            jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" \
              | { grep -ioE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' || [ $? = 1 ]; } \
              | { grep -oE '[0-9]+' || [ $? = 1 ]; } | sort -u \
              | while read -r n; do move_if_open "$n" "$1"; done
          }
          move_pr() { move "$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")" "$1"; move_closed "$1"; }
          issue_number=$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")
          open=$(jq -r '.issue.state // empty' "$GITHUB_EVENT_PATH")

          case "$EVENT/$ACTION" in
            workflow_dispatch/*)
              move "$NUMBER" "$STATUS" ;;
            issues/assigned)
              # Une tâche se prend en s'assignant l'issue (AGENTS.md).
              if has_label "type:tâche" && [ "$open" = open ] && ! has_label "bloqué"; then move "$issue_number" "In progress"; fi ;;
            issues/unassigned)
              left=$(jq '.issue.assignees | length' "$GITHUB_EVENT_PATH")
              if has_label "type:tâche" && [ "$open" = open ] && [ "$left" = 0 ] && ! has_label "bloqué"; then move "$issue_number" "Todo"; fi ;;
            issues/labeled|issues/unlabeled)
              # Le label « bloqué » met la carte en « Blocked » ; son retrait la remet en « Todo » ou « In progress ».
              if [ "$open" = open ] && has_label "type:tâche"; then
                if has_label "bloqué"; then
                  move "$issue_number" "Blocked"
                elif [ "$ACTION" = unlabeled ] && [ "$(jq -r '.label.name' "$GITHUB_EVENT_PATH")" = "bloqué" ]; then
                  if [ "$(jq '.issue.assignees | length' "$GITHUB_EVENT_PATH")" -gt 0 ]; then move "$issue_number" "In progress"; else move "$issue_number" "Todo"; fi
                fi
              fi ;;
            issues/opened|issues/closed)
              if [ "$ACTION" = opened ]; then
                if has_label "bloqué"; then move "$issue_number" "Blocked"; else move "$issue_number" "Todo"; fi
              fi
              # Une issue « décision » nomme la tâche qu'elle bloque sous « Tâche bloquée ».
              if has_label "décision"; then
                task=$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" \
                  | awk '/^### Tâche bloquée/{f=1; next} /^### /{f=0} f' \
                  | grep -oE '#[0-9]+' | head -n1 | tr -d '#' || true)
                if [ -n "$task" ]; then
                  if [ "$ACTION" = opened ]; then move_if_open "$task" "Blocked"; else move_if_open "$task" "In progress"; fi
                fi
              fi ;;
            pull_request/synchronize)
              # Un push sur une PR où des changements sont demandés la rend au relecteur.
              if [ "$(jq -r '.pull_request.draft' "$GITHUB_EVENT_PATH")" = false ]; then
                decision=$(GH_TOKEN="$REPO_TOKEN" gh pr view "$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")" \
                  --repo "$GITHUB_REPOSITORY" --json reviewDecision --jq '.reviewDecision')
                if [ "$decision" = CHANGES_REQUESTED ]; then move_pr "In review"; fi
              fi ;;
            pull_request/*)
              if [ "$(jq -r '.pull_request.draft' "$GITHUB_EVENT_PATH")" = false ]; then move_closed "In review"; fi ;;
            pull_request_review/submitted)
              # Changements demandés : la PR attend son auteur, elle quitte « In review » jusqu'au prochain push.
              if [ "$(jq -r '.review.state' "$GITHUB_EVENT_PATH")" = changes_requested ]; then move_pr "In progress"; fi ;;
          esac

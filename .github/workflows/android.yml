name: Android (APK debug)

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Le projet natif android/ est versionné (voir docs/adr/0006) ; on le génère seulement s'il manque.
      - name: Projet Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Assemble debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: croncare-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Sur un tag v0.x.0 : crée la GitHub Release et y joint l'APK (voir docs/MISE-EN-PRODUCTION.md).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: croncare-debug-apk
      - name: Release avec l'APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv app-debug.apk "croncare-$TAG-debug.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "croncare-$TAG-debug.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "croncare-$TAG-debug.apk" --repo "$GITHUB_REPOSITORY" \
              --title "CronCare $TAG" --notes "Voir CHANGELOG.md." --verify-tag
          fi
